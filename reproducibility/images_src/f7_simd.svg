<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1200" width="960" height="1200">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans CJK JP', 'Noto Sans', sans-serif; }
    .title { font-size: 23px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 13px; fill: #4b5563; }
    .panelTitle { font-size: 16px; font-weight: 700; fill: #1e3a5f; }
    .diamond { fill: #ffffff; stroke: #374151; stroke-width: 1.6; }
    .qtext { font-size: 13px; font-weight: 700; fill: #111827; }
    .boxtext { font-size: 13px; font-weight: 700; fill: #111827; }
    .boxsub { font-size: 11.5px; fill: #374151; }
    .branchlabel { font-size: 12px; font-weight: 700; }
    .notegreen { font-size: 12.5px; font-weight: 700; fill: #1b5e20; }
    .noteorange { font-size: 12.5px; font-weight: 700; fill: #c2410c; }
    .noteblack { font-size: 12px; fill: #111827; }
    .chiptext { font-size: 10.5px; font-weight: 700; fill: #ffffff; }
    .svmlnote { font-size: 11px; fill: #6b7280; }
    .tablehead { font-size: 13px; font-weight: 700; fill: #111827; }
    .tablecell { font-size: 13px; fill: #111827; }
    .tablecond { font-size: 12.5px; fill: #111827; }
    .legend { font-size: 12px; fill: #374151; }
    .note { font-size: 13px; fill: #111827; }
    .notesub { font-size: 12px; fill: #374151; }
    .decisive { font-size: 12px; font-weight: 700; fill: #1565c0; }
    .footnote { font-size: 12px; fill: #6b7280; }
  </style>

  <rect x="0" y="0" width="960" height="1200" fill="#ffffff"/>

  <text x="30" y="36" class="title">F7. 超越関数は、AVX-512専用カーネルの有無でlibmを経由するか決まる</text>
  <text x="30" y="58" class="subtitle">NumPy 2.2.6のexp/log/sinディスパッチ機構(原理図)。AVX-512専用カーネルの有無がlibmを経由するかを決め、logだけは</text>
  <text x="30" y="74" class="subtitle">AVX-512があっても一部の入力でlibmへフォールバックする。実測はblade1台でAVX-512のみを無効化した決定実験による。</text>
  <line x1="30" y1="88" x2="930" y2="88" stroke="#e5e7eb" stroke-width="2"/>

  <!-- ============ exp/log dispatch ============ -->
  <text x="30" y="116" class="panelTitle">np.exp(x) / np.log(x)(float64)のディスパッチ</text>

  <rect x="460" y="98" width="470" height="34" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="474" y="119" class="svmlnote">(SVMLリンク時のみ有効。通常のPyPIホイールでは無効、本実測も非該当)</text>

  <polygon points="480,138 585,183 480,228 375,183" class="diamond"/>
  <text x="480" y="178" class="qtext" text-anchor="middle">AVX512Fが</text>
  <text x="480" y="196" class="qtext" text-anchor="middle">使えるか?</text>

  <line x1="400" y1="206" x2="270" y2="266" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="238" class="branchlabel" fill="#1b5e20" text-anchor="middle">YES</text>

  <line x1="560" y1="206" x2="700" y2="266" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="672" y="238" class="branchlabel" fill="#6b7280" text-anchor="middle">NO</text>

  <!-- YES branch: libc非依存のNumPy内製カーネル(expとlogで内部の分岐が異なる) -->
  <rect x="70" y="266" width="400" height="190" rx="8" fill="#1b5e20" fill-opacity="0.07" stroke="#1b5e20" stroke-opacity="0.45" stroke-width="1.5"/>

  <rect x="90" y="280" width="42" height="22" rx="5" fill="#1b5e20"/>
  <text x="111" y="296" class="chiptext" text-anchor="middle">EXP</text>
  <text x="144" y="297" class="boxtext">AVX512F_exp_DOUBLE</text>
  <text x="90" y="320" class="notegreen">→ libmを通らない(全要素が内製カーネル)</text>

  <line x1="90" y1="336" x2="450" y2="336" stroke="#1b5e20" stroke-opacity="0.3" stroke-width="1"/>

  <rect x="90" y="350" width="42" height="22" rx="5" fill="#1565c0"/>
  <text x="111" y="366" class="chiptext" text-anchor="middle">LOG</text>
  <text x="144" y="367" class="boxtext">AVX512F_log_DOUBLE</text>
  <text x="90" y="390" class="noteblack">→ 大多数の要素は内製カーネルのまま(libmを通らない)</text>
  <text x="90" y="410" class="noteorange">↳ ただし x∈[0.9375, 1.0647]の要素だけ</text>
  <text x="104" y="427" class="noteorange">npy_log()(libm)へマスク付きフォールバック</text>

  <!-- NO branch: libmへフォールバック -->
  <rect x="510" y="266" width="380" height="50" rx="8" fill="#ef6c00" fill-opacity="0.08" stroke="#ef6c00" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="530" y="296" class="boxtext">npy_exp / npy_log(スカラー経路)</text>
  <line x1="700" y1="316" x2="700" y2="342" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="510" y="342" width="380" height="50" rx="8" fill="#ef6c00" fill-opacity="0.08" stroke="#ef6c00" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="530" y="372" class="boxtext">プラットフォームのlibm(glibc / musl)</text>
  <text x="530" y="410" class="noteorange">→ glibcとmuslで結果が変わりうる(AVX-512Fが無い環境)</text>

  <line x1="30" y1="480" x2="930" y2="480" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ============ sin/cos dispatch ============ -->
  <text x="30" y="508" class="panelTitle">np.sin(x)(float64)のディスパッチ</text>
  <rect x="70" y="522" width="820" height="50" rx="8" fill="#ef6c00" fill-opacity="0.08" stroke="#ef6c00" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="480" y="552" text-anchor="middle" class="boxtext">常に libm 経由(glibc / musl)— AVX-512の有無によらず固定</text>
  <text x="90" y="590" class="noteorange">→ NumPy 2.2.6は「Disable SIMD code sin/cos f64 and revert to libm」としてSIMD経路を撤回し、常にlibmへ戻す</text>

  <line x1="30" y1="614" x2="930" y2="614" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ============ measured values ============ -->
  <text x="30" y="642" class="panelTitle">実測(ハッシュ値。第6章G2・決定実験より)</text>

  <text x="40" y="666" class="tablehead">条件</text>
  <text x="320" y="666" class="tablehead">exp(float64)</text>
  <text x="460" y="666" class="tablehead">log(線形一様)</text>
  <text x="600" y="666" class="tablehead">log(対数一様)</text>
  <text x="760" y="666" class="tablehead">sin(float64)</text>
  <line x1="30" y1="674" x2="930" y2="674" stroke="#111827" stroke-width="1.3"/>

  <!-- Row1: blade AVX-512あり glibc -->
  <text x="40" y="700" class="tablecond">blade(AVX-512あり・glibc)</text>
  <rect x="310" y="682" width="130" height="28" fill="#1b5e20" fill-opacity="0.12" stroke="#1b5e20" stroke-opacity="0.35"/>
  <text x="320" y="700" class="tablecell">5119b269</text>
  <rect x="450" y="682" width="130" height="28" fill="#1b5e20" fill-opacity="0.12" stroke="#1b5e20" stroke-opacity="0.35"/>
  <text x="460" y="700" class="tablecell">a6b6b7fa</text>
  <rect x="590" y="682" width="150" height="28" fill="#f9a825" fill-opacity="0.22" stroke="#f9a825" stroke-opacity="0.6"/>
  <text x="600" y="700" class="tablecell">002faa54</text>
  <rect x="750" y="682" width="150" height="28" fill="#ef6c00" fill-opacity="0.12" stroke="#ef6c00" stroke-opacity="0.35"/>
  <text x="760" y="700" class="tablecell">ddf398b7</text>

  <!-- Row2: blade AVX-512あり musl -->
  <text x="40" y="732" class="tablecond">blade(AVX-512あり・musl)</text>
  <rect x="310" y="714" width="130" height="28" fill="#1b5e20" fill-opacity="0.12" stroke="#1b5e20" stroke-opacity="0.35"/>
  <text x="320" y="732" class="tablecell">5119b269</text>
  <rect x="450" y="714" width="130" height="28" fill="#1b5e20" fill-opacity="0.12" stroke="#1b5e20" stroke-opacity="0.35"/>
  <text x="460" y="732" class="tablecell">a6b6b7fa</text>
  <rect x="590" y="714" width="150" height="28" fill="#f9a825" fill-opacity="0.22" stroke="#f9a825" stroke-opacity="0.6"/>
  <text x="600" y="732" class="tablecell">002faa54</text>
  <rect x="750" y="714" width="150" height="28" fill="#ef6c00" fill-opacity="0.12" stroke="#ef6c00" stroke-opacity="0.35"/>
  <text x="760" y="732" class="tablecell">601eb0fa</text>

  <!-- Row3: blade AVX-512無効化 musl (決定実験) -->
  <rect x="30" y="744" width="4" height="32" fill="#1565c0"/>
  <text x="40" y="764" class="tablecond" font-weight="700">★ blade(AVX-512無効化・musl)</text>
  <rect x="310" y="746" width="130" height="28" fill="#1565c0" fill-opacity="0.14" stroke="#1565c0" stroke-opacity="0.5" stroke-width="1.3"/>
  <text x="320" y="764" class="tablecell">ab300a28</text>
  <rect x="450" y="746" width="130" height="28" fill="#1565c0" fill-opacity="0.14" stroke="#1565c0" stroke-opacity="0.5" stroke-width="1.3"/>
  <text x="460" y="764" class="tablecell">28ff757a</text>
  <rect x="590" y="746" width="150" height="28" fill="#1565c0" fill-opacity="0.14" stroke="#1565c0" stroke-opacity="0.5" stroke-width="1.3"/>
  <text x="600" y="764" class="tablecell">a94b95a8</text>
  <rect x="750" y="746" width="150" height="28" fill="#1565c0" fill-opacity="0.14" stroke="#1565c0" stroke-opacity="0.5" stroke-width="1.3"/>
  <text x="760" y="764" class="tablecell">601eb0fa</text>

  <!-- Row4: anakin AVX2 glibc -->
  <text x="40" y="796" class="tablecond">anakin(AVX2・glibc)</text>
  <rect x="310" y="778" width="130" height="28" fill="#ef6c00" fill-opacity="0.12" stroke="#ef6c00" stroke-opacity="0.35"/>
  <text x="320" y="796" class="tablecell">cba8bfa7</text>
  <rect x="450" y="778" width="130" height="28" fill="#ef6c00" fill-opacity="0.12" stroke="#ef6c00" stroke-opacity="0.35"/>
  <text x="460" y="796" class="tablecell">09cef322</text>
  <rect x="590" y="778" width="150" height="28" fill="#ef6c00" fill-opacity="0.12" stroke="#ef6c00" stroke-opacity="0.35"/>
  <text x="600" y="796" class="tablecell">d2294321</text>
  <rect x="750" y="778" width="150" height="28" fill="#ef6c00" fill-opacity="0.12" stroke="#ef6c00" stroke-opacity="0.35"/>
  <text x="760" y="796" class="tablecell">ddf398b7</text>

  <!-- Row5: anakin AVX2 musl -->
  <text x="40" y="828" class="tablecond">anakin(AVX2・musl)</text>
  <rect x="310" y="810" width="130" height="28" fill="#ef6c00" fill-opacity="0.12" stroke="#ef6c00" stroke-opacity="0.35"/>
  <text x="320" y="828" class="tablecell">ab300a28</text>
  <rect x="450" y="810" width="130" height="28" fill="#ef6c00" fill-opacity="0.12" stroke="#ef6c00" stroke-opacity="0.35"/>
  <text x="460" y="828" class="tablecell">28ff757a</text>
  <rect x="590" y="810" width="150" height="28" fill="#ef6c00" fill-opacity="0.12" stroke="#ef6c00" stroke-opacity="0.35"/>
  <text x="600" y="828" class="tablecell">a94b95a8</text>
  <rect x="750" y="810" width="150" height="28" fill="#ef6c00" fill-opacity="0.12" stroke="#ef6c00" stroke-opacity="0.35"/>
  <text x="760" y="828" class="tablecell">601eb0fa</text>

  <!-- legend: 色は「機構の推測」ではなく「glibc/muslの実測結果が同じか」という観測を表す。
       同じでも、libmを経由していない(緑)のか、libmを経由したのにたまたま一致した(金)のかは別物。 -->
  <rect x="40" y="854" width="14" height="14" fill="#1b5e20" fill-opacity="0.3" stroke="#1b5e20"/>
  <text x="60" y="866" class="legend">glibc/muslで同じ(libmを経由していない)</text>
  <rect x="380" y="854" width="14" height="14" fill="#f9a825" fill-opacity="0.45" stroke="#f9a825"/>
  <text x="400" y="866" class="legend">glibc/muslで同じだが、libmを経由した(たまたま一致)</text>
  <rect x="40" y="878" width="14" height="14" fill="#ef6c00" fill-opacity="0.3" stroke="#ef6c00"/>
  <text x="60" y="890" class="legend">glibc/muslで異なる(libmを経由)</text>
  <rect x="380" y="878" width="14" height="14" fill="#1565c0" fill-opacity="0.3" stroke="#1565c0"/>
  <text x="400" y="890" class="legend">★ AVX-512のみを無効化(決定実験)</text>

  <text x="40" y="916" class="note">AVX-512があるとexpは常にlibmを経由せず一致する(緑)。log(線形一様)もフォールバック窓に入らず一致する(緑)。</text>
  <text x="40" y="934" class="note">一方log(対数一様)はフォールバック窓に入りlibmを実際に経由するが、たまたまglibcとmuslが同じビットを返した(金)。</text>
  <text x="40" y="952" class="note">AVX-512が無いとexp/log/sinは全てlibmを経由し、glibcとmuslで異なる(橙)。「変わらない」ことと「libmを通らない」ことは別の主張である。</text>

  <text x="40" y="972" class="decisive">blade1台の中でAVX-512を無効化した瞬間、exp・log(線形一様)・log(対数一様)の値が動いた(主証拠)。</text>
  <text x="40" y="990" class="decisive">exp: 5119b269→ab300a28、log(線形一様): a6b6b7fa→28ff757a、log(対数一様): 002faa54→a94b95a8。</text>
  <text x="40" y="1008" class="decisive">さらにこの値は、別マシン(AVX2どまりのanakin)のmuslの値とも完全一致した(補強証拠)。</text>

  <text x="40" y="1028" class="notesub">log(対数一様)はlog(線形一様)と入力分布が異なり、libmフォールバック窓[0.9375, 1.0647]に入るサンプル数も異なる(詳細は本文)。</text>

  <!-- L3 mechanism callout -->
  <rect x="30" y="1046" width="900" height="76" fill="#fff7ed" stroke="#ef6c00" stroke-opacity="0.5" stroke-width="1.5" rx="8"/>
  <rect x="44" y="1060" width="44" height="42" rx="8" fill="#ef6c00"/>
  <text x="66" y="1087" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff" font-family="'Noto Sans CJK JP','Noto Sans',sans-serif">L3</text>
  <text x="104" y="1076" font-size="13" fill="#111827" font-family="'Noto Sans CJK JP','Noto Sans',sans-serif">AVX-512専用カーネルの有無が、exp/logがlibmにフォールバックするか(→glibc/muslの違いが出るか)を決める。logは</text>
  <text x="104" y="1096" font-size="13" fill="#111827" font-family="'Noto Sans CJK JP','Noto Sans',sans-serif">AVX-512があっても1.0近傍だけ例外的にlibmを呼ぶ。sinは常にlibm経由のため、AVX-512の有無によらず常にL3に属する。</text>

  <text x="30" y="1150" class="footnote">原理図+実測。分岐の機構はNumPy 2.2.6のソース(loops_exponent_log.dispatch.c.src 887・953-988・1088行目、loops_trigonometric.dispatch.cpp)に基づく。</text>
  <text x="30" y="1168" class="footnote">ハッシュ値は第6章G2の実測・決定実験(事前登録、コミット63d9e38)より。SVML経路は通常のPyPIホイールでは有効でないことが多く、本実測の環境でも該当しない。</text>
</svg>
