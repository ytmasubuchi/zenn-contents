<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 575" width="960" height="575">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans CJK JP', 'Noto Sans', sans-serif; }
    .title { font-size: 25px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 13px; fill: #4b5563; }
    .panelTitle { font-size: 18px; font-weight: 700; fill: #1e3a5f; }
    .stepText { font-size: 15px; fill: #111827; }
    .stepNote { font-size: 12px; fill: #6b7280; }
    .resultText { font-size: 20px; font-weight: 700; fill: #111827; }
    .footnote { font-size: 12px; fill: #6b7280; }
    .stepbox { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.4; rx: 8; }
    .resultbox { fill: #eef2ff; stroke: #4338ca; stroke-width: 2; rx: 8; }
  </style>

  <rect x="0" y="0" width="960" height="575" fill="#ffffff"/>

  <text x="30" y="38" class="title">F5. 浮動小数点の加算に結合則はない</text>
  <text x="30" y="60" class="subtitle">出典: Goldberg, "What Every Computer Scientist Should Know About Floating-Point Arithmetic" (1991) の例。x = 10^30, y = −10^30, z = 1 とする。</text>

  <line x1="30" y1="72" x2="930" y2="72" stroke="#e5e7eb" stroke-width="2"/>

  <!-- Panel A: (x+y)+z -->
  <text x="60" y="102" class="panelTitle">(x + y) + z</text>
  <rect x="60" y="116" width="390" height="56" class="stepbox"/>
  <text x="80" y="150" class="stepText">x + y = 0</text>
  <line x1="255" y1="172" x2="255" y2="196" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="198" width="390" height="56" class="stepbox"/>
  <text x="80" y="232" class="stepText">0 + z = 1</text>
  <line x1="255" y1="254" x2="255" y2="278" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="280" width="390" height="66" class="resultbox"/>
  <text x="80" y="322" class="resultText">結果: 1</text>

  <!-- Panel B: x+(y+z) -->
  <text x="510" y="102" class="panelTitle">x + (y + z)</text>
  <rect x="510" y="116" width="390" height="56" class="stepbox"/>
  <text x="530" y="142" class="stepText">y + z = −10^30</text>
  <text x="530" y="162" class="stepNote">(z=1 は 10^30 の精度(53bit仮数)に対して小さすぎ、丸めで消える)</text>
  <line x1="705" y1="172" x2="705" y2="196" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="510" y="198" width="390" height="56" class="stepbox"/>
  <text x="530" y="232" class="stepText">x + (−10^30) = 0</text>
  <line x1="705" y1="254" x2="705" y2="278" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="510" y="280" width="390" height="66" class="resultbox"/>
  <text x="530" y="322" class="resultText">結果: 0</text>

  <!-- comparison callout -->
  <text x="480" y="390" text-anchor="middle" font-size="16" fill="#111827" font-family="'Noto Sans CJK JP','Noto Sans',sans-serif">同じ x, y, z、同じ「加算」なのに、足す順序だけで結果が分かれる</text>
  <text x="480" y="422" text-anchor="middle" font-size="26" font-weight="700" fill="#c62828" font-family="'Noto Sans CJK JP','Noto Sans',sans-serif">1 ≠ 0</text>

  <!-- mechanism note + L3 badge -->
  <rect x="30" y="450" width="900" height="70" fill="#fff7ed" stroke="#ef6c00" stroke-opacity="0.5" stroke-width="1.5" rx="8"/>
  <rect x="44" y="464" width="44" height="42" rx="8" fill="#ef6c00"/>
  <text x="66" y="491" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff" font-family="'Noto Sans CJK JP','Noto Sans',sans-serif">L3</text>
  <text x="104" y="480" font-size="13" fill="#111827" font-family="'Noto Sans CJK JP','Noto Sans',sans-serif">この性質がL3(実行時環境)の根本原因: IEEE754は個々の演算(+ − × ÷ √・FMA)の丸めは規定するが、</text>
  <text x="104" y="500" font-size="13" fill="#111827" font-family="'Noto Sans CJK JP','Noto Sans',sans-serif">複数の演算をどの順序・グループで評価するかは規定しない。順序はコンパイラ・SIMD幅・スレッド分割など実行環境が決める。</text>

  <text x="30" y="538" class="footnote">原理図(実測に依存しない)。IEEE754の正確な節番号は本図では引用しない(一次PDFの該当箇所をテキスト抽出できず、流通する番号は二次情報のため。</text>
  <text x="30" y="554" class="footnote">調査ノート ieee754_floating_point.md 参照)。</text>
</svg>
