<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 980" width="960" height="980">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans CJK JP', 'Noto Sans', sans-serif; }
    .title { font-size: 23px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 13px; fill: #4b5563; }
    .panelTitle { font-size: 16px; font-weight: 700; fill: #1e3a5f; }
    .diamond { fill: #ffffff; stroke: #374151; stroke-width: 1.6; }
    .qtext { font-size: 13px; font-weight: 700; fill: #111827; }
    .boxtext { font-size: 13px; font-weight: 700; fill: #111827; }
    .boxsub { font-size: 11.5px; fill: #374151; }
    .branchlabel { font-size: 12px; font-weight: 700; }
    .notegreen { font-size: 12.5px; font-weight: 700; fill: #1b5e20; }
    .noteorange { font-size: 12.5px; font-weight: 700; fill: #c2410c; }
    .svmlnote { font-size: 11px; fill: #6b7280; }
    .tablehead { font-size: 13px; font-weight: 700; fill: #111827; }
    .tablecell { font-size: 13px; fill: #111827; }
    .tablecond { font-size: 12.5px; fill: #111827; }
    .legend { font-size: 12px; fill: #374151; }
    .note { font-size: 13px; fill: #111827; }
    .footnote { font-size: 12px; fill: #6b7280; }
  </style>

  <rect x="0" y="0" width="960" height="980" fill="#ffffff"/>

  <text x="30" y="36" class="title">F6. 超越関数は、AVX-512専用カーネルの有無でlibmを経由するか決まる</text>
  <text x="30" y="58" class="subtitle">NumPy 2.2.6のexp/log/sinディスパッチ機構(原理図+実測)。「SIMD幅で縮約の足す順序が変わる」という旧説明は、</text>
  <text x="30" y="74" class="subtitle">実測で確認できなかったため本図に置き換えた。</text>
  <line x1="30" y1="88" x2="930" y2="88" stroke="#e5e7eb" stroke-width="2"/>

  <!-- ============ exp/log dispatch ============ -->
  <text x="30" y="116" class="panelTitle">np.exp(x) / np.log(x)(float64)のディスパッチ</text>

  <rect x="460" y="98" width="470" height="34" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="474" y="119" class="svmlnote">(SVMLリンク時のみ有効。通常のPyPIホイールでは無効、本実測も非該当)</text>

  <polygon points="480,138 585,183 480,228 375,183" class="diamond"/>
  <text x="480" y="178" class="qtext" text-anchor="middle">AVX512Fが</text>
  <text x="480" y="196" class="qtext" text-anchor="middle">使えるか?</text>

  <line x1="400" y1="206" x2="270" y2="266" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="238" class="branchlabel" fill="#1b5e20" text-anchor="middle">YES</text>

  <line x1="560" y1="206" x2="700" y2="266" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="672" y="238" class="branchlabel" fill="#6b7280" text-anchor="middle">NO</text>

  <!-- YES branch: libc非依存のNumPy内製カーネル -->
  <rect x="70" y="266" width="380" height="74" rx="8" fill="#1b5e20" fill-opacity="0.08" stroke="#1b5e20" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="90" y="294" class="boxtext">NumPy内製カーネル</text>
  <text x="90" y="316" class="boxsub">AVX512F_exp_DOUBLE / AVX512F_log_DOUBLE</text>
  <text x="90" y="358" class="notegreen">→ libcを通らない(glibc/muslを替えても同じ)</text>

  <!-- NO branch: libmへフォールバック -->
  <rect x="510" y="266" width="380" height="50" rx="8" fill="#ef6c00" fill-opacity="0.08" stroke="#ef6c00" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="530" y="296" class="boxtext">npy_exp / npy_log(スカラー経路)</text>
  <line x1="700" y1="316" x2="700" y2="342" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="510" y="342" width="380" height="50" rx="8" fill="#ef6c00" fill-opacity="0.08" stroke="#ef6c00" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="530" y="372" class="boxtext">プラットフォームのlibm(glibc / musl)</text>
  <text x="530" y="410" class="noteorange">→ glibcとmuslで結果が変わりうる(AVX-512Fが無い環境)</text>

  <line x1="30" y1="436" x2="930" y2="436" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ============ sin/cos dispatch ============ -->
  <text x="30" y="464" class="panelTitle">np.sin(x)(float64)のディスパッチ</text>
  <rect x="70" y="478" width="820" height="50" rx="8" fill="#ef6c00" fill-opacity="0.08" stroke="#ef6c00" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="480" y="508" text-anchor="middle" class="boxtext">常に libm 経由(glibc / musl)— AVX-512の有無によらず固定</text>
  <text x="90" y="546" class="noteorange">→ NumPy 2.2.6は「Disable SIMD code sin/cos f64 and revert to libm」としてSIMD経路を撤回し、常にlibmへ戻す</text>

  <line x1="30" y1="572" x2="930" y2="572" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ============ measured values ============ -->
  <text x="30" y="600" class="panelTitle">実測(ハッシュ値。第6章G2・決定実験より)</text>

  <text x="40" y="624" class="tablehead">条件</text>
  <text x="350" y="624" class="tablehead">exp(float64)</text>
  <text x="650" y="624" class="tablehead">sin(float64)</text>
  <line x1="30" y1="632" x2="930" y2="632" stroke="#111827" stroke-width="1.3"/>

  <text x="40" y="654" class="tablecond">blade(AVX-512あり・glibc)</text>
  <rect x="340" y="636" width="290" height="28" fill="#1b5e20" fill-opacity="0.12" stroke="#1b5e20" stroke-opacity="0.35"/>
  <text x="350" y="654" class="tablecell">5119b269</text>
  <rect x="640" y="636" width="290" height="28" fill="#ef6c00" fill-opacity="0.12" stroke="#ef6c00" stroke-opacity="0.35"/>
  <text x="650" y="654" class="tablecell">ddf398b7</text>

  <text x="40" y="686" class="tablecond">blade(AVX-512あり・musl)</text>
  <rect x="340" y="668" width="290" height="28" fill="#1b5e20" fill-opacity="0.12" stroke="#1b5e20" stroke-opacity="0.35"/>
  <text x="350" y="686" class="tablecell">5119b269</text>
  <rect x="640" y="668" width="290" height="28" fill="#ef6c00" fill-opacity="0.12" stroke="#ef6c00" stroke-opacity="0.35"/>
  <text x="650" y="686" class="tablecell">601eb0fa</text>

  <text x="40" y="718" class="tablecond">dgxspark(AVX-512なし・glibc)</text>
  <rect x="340" y="700" width="290" height="28" fill="#ef6c00" fill-opacity="0.12" stroke="#ef6c00" stroke-opacity="0.35"/>
  <text x="350" y="718" class="tablecell">cba8bfa7</text>
  <rect x="640" y="700" width="290" height="28" fill="#ef6c00" fill-opacity="0.12" stroke="#ef6c00" stroke-opacity="0.35"/>
  <text x="650" y="718" class="tablecell">ddf398b7</text>

  <text x="40" y="750" class="tablecond">dgxspark(AVX-512なし・musl)</text>
  <rect x="340" y="732" width="290" height="28" fill="#ef6c00" fill-opacity="0.12" stroke="#ef6c00" stroke-opacity="0.35"/>
  <text x="350" y="750" class="tablecell">ab300a28</text>
  <rect x="640" y="732" width="290" height="28" fill="#ef6c00" fill-opacity="0.12" stroke="#ef6c00" stroke-opacity="0.35"/>
  <text x="650" y="750" class="tablecell">601eb0fa</text>

  <rect x="40" y="772" width="14" height="14" fill="#1b5e20" fill-opacity="0.3" stroke="#1b5e20"/>
  <text x="60" y="784" class="legend">libcを替えても同じ(AVX-512カーネルがlibcを迂回)</text>
  <rect x="490" y="772" width="14" height="14" fill="#ef6c00" fill-opacity="0.3" stroke="#ef6c00"/>
  <text x="510" y="784" class="legend">libcを替えると変わる(libmへフォールバック)</text>

  <text x="40" y="810" class="note">AVX-512があるとexpはlibcを替えても変わらない(緑)。無いとlibcで変わる(橙)。sinは常にlibcで変わる(全行橙)。</text>

  <!-- L3 mechanism callout -->
  <rect x="30" y="832" width="900" height="76" fill="#fff7ed" stroke="#ef6c00" stroke-opacity="0.5" stroke-width="1.5" rx="8"/>
  <rect x="44" y="846" width="44" height="42" rx="8" fill="#ef6c00"/>
  <text x="66" y="873" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff" font-family="'Noto Sans CJK JP','Noto Sans',sans-serif">L3</text>
  <text x="104" y="862" font-size="13" fill="#111827" font-family="'Noto Sans CJK JP','Noto Sans',sans-serif">AVX-512専用カーネルの有無が、expがlibmにフォールバックするか(→glibc/muslの違いが出るか)を決める。sinは常に</text>
  <text x="104" y="882" font-size="13" fill="#111827" font-family="'Noto Sans CJK JP','Noto Sans',sans-serif">libmにフォールバックするため、AVX-512の有無によらず常にL3(実行時環境)に属する。</text>

  <text x="30" y="936" class="footnote">原理図+実測。分岐の機構はNumPy 2.2.6のソース(loops_exponent_log.dispatch.c.src、loops_trigonometric.dispatch.cpp)に基づく。ハッシュ値は第6章G2の</text>
  <text x="30" y="954" class="footnote">実測・決定実験(事前登録、コミット63d9e38)より。SVML経路は通常のPyPIホイールでは有効でないことが多く、本実測の環境でも該当しない。</text>
</svg>
