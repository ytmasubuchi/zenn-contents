<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 730" width="960" height="730">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans CJK JP', 'Noto Sans', sans-serif; }
    .title { font-size: 25px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 13px; fill: #4b5563; }
    .panelTitle { font-size: 15px; font-weight: 700; fill: #1e3a5f; }
    .cellText { font-size: 13px; fill: #111827; }
    .note { font-size: 13px; fill: #374151; }
    .footnote { font-size: 12px; fill: #6b7280; }
    .inputcell { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1; }
    .inputval { font-size: 10px; fill: #374151; }
    .groupbox { fill: #eef2ff; stroke: #4338ca; stroke-width: 2; rx: 8; }
    .panel2 { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 10; }
    .caveatbox { fill: #fef2f2; stroke: #c62828; stroke-width: 1.3; rx: 8; }
  </style>

  <rect x="0" y="0" width="960" height="730" fill="#ffffff"/>

  <text x="30" y="38" class="title">F6. SIMD幅が変わると縮約(reduction)の足す順序が変わる</text>
  <text x="30" y="58" class="subtitle">機構の図解(入力の数値はダミー。具体的な実測差ではなく「グルーピングの違い」そのものを示す)。</text>
  <line x1="30" y1="70" x2="930" y2="70" stroke="#e5e7eb" stroke-width="2"/>

  <!-- shared input row, now with dummy values (fix round 1, Important 6:
       the subtitle promised dummy numbers but the cells were blank) -->
  <text x="480" y="92" text-anchor="middle" font-size="13" fill="#374151" font-family="'Noto Sans CJK JP','Noto Sans',sans-serif">同じ入力 a0..a15(数値はダミー)</text>
  <g>
    <rect x="180" y="98" width="37" height="28" class="inputcell"/><text x="198" y="116" text-anchor="middle" class="inputval">0.2</text>
    <rect x="217" y="98" width="37" height="28" class="inputcell"/><text x="235" y="116" text-anchor="middle" class="inputval">-0.5</text>
    <rect x="254" y="98" width="37" height="28" class="inputcell"/><text x="272" y="116" text-anchor="middle" class="inputval">1.1</text>
    <rect x="291" y="98" width="37" height="28" class="inputcell"/><text x="309" y="116" text-anchor="middle" class="inputval">0.0</text>
    <rect x="328" y="98" width="37" height="28" class="inputcell"/><text x="346" y="116" text-anchor="middle" class="inputval">-0.3</text>
    <rect x="365" y="98" width="37" height="28" class="inputcell"/><text x="383" y="116" text-anchor="middle" class="inputval">0.8</text>
    <rect x="402" y="98" width="37" height="28" class="inputcell"/><text x="420" y="116" text-anchor="middle" class="inputval">-1.2</text>
    <rect x="439" y="98" width="37" height="28" class="inputcell"/><text x="457" y="116" text-anchor="middle" class="inputval">0.4</text>
    <rect x="476" y="98" width="37" height="28" class="inputcell"/><text x="494" y="116" text-anchor="middle" class="inputval">0.6</text>
    <rect x="513" y="98" width="37" height="28" class="inputcell"/><text x="531" y="116" text-anchor="middle" class="inputval">-0.1</text>
    <rect x="550" y="98" width="37" height="28" class="inputcell"/><text x="568" y="116" text-anchor="middle" class="inputval">0.9</text>
    <rect x="587" y="98" width="37" height="28" class="inputcell"/><text x="605" y="116" text-anchor="middle" class="inputval">-0.7</text>
    <rect x="624" y="98" width="37" height="28" class="inputcell"/><text x="642" y="116" text-anchor="middle" class="inputval">0.3</text>
    <rect x="661" y="98" width="37" height="28" class="inputcell"/><text x="679" y="116" text-anchor="middle" class="inputval">-0.4</text>
    <rect x="698" y="98" width="37" height="28" class="inputcell"/><text x="716" y="116" text-anchor="middle" class="inputval">1.0</text>
    <rect x="735" y="98" width="37" height="28" class="inputcell"/><text x="753" y="116" text-anchor="middle" class="inputval">-0.2</text>
  </g>

  <line x1="330" y1="126" x2="250" y2="160" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="126" x2="720" y2="160" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- left tree: 8-wide. fix round 1, Important 5: the previous version
       said "a0..a7 を合算 -> P0" / "a8..a15 を合算 -> P1", which is not
       how an 8-wide reduction groups 16 elements — it pairs lane i with
       lane i+8 (both loaded into the same 8-lane register across two
       loads), then reduces those 8 lanes horizontally. Restated as that
       two-step process: lane-wise pairing, then a horizontal reduce. -->
  <text x="50" y="180" class="panelTitle">8並列(float32、256bit÷32bit = 8要素/レジスタ)</text>
  <rect x="50" y="192" width="400" height="66" class="groupbox"/>
  <text x="65" y="216" font-size="15" font-weight="700" fill="#111827" font-family="'Noto Sans CJK JP','Noto Sans',sans-serif">a[i] と a[i+8] をレーンごとに加算(i=0..7)</text>
  <text x="65" y="240" class="cellText">→ 8要素の部分和ベクトル P[0..7]</text>

  <line x1="250" y1="258" x2="250" y2="286" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="50" y="288" width="400" height="66" class="groupbox"/>
  <text x="65" y="312" font-size="15" font-weight="700" fill="#111827" font-family="'Noto Sans CJK JP','Noto Sans',sans-serif">P[0..7] を水平加算(log2(8)=3段階)</text>
  <text x="65" y="336" class="cellText">→ S8(最終結果)</text>

  <!-- right tree: 16-wide. fix round 1, Important 5: the previous
       version said a single vector operation reduces 16 lanes to a
       scalar — no such instruction exists; a horizontal reduction
       (here log2(16)=4 steps) is still required. What genuinely differs
       from the left tree is that all 16 elements already fit in one
       register, so no lane-pairing step across two loads is needed
       first. -->
  <text x="520" y="180" class="panelTitle">16並列(float32、512bit÷32bit = 16要素/レジスタ)</text>
  <rect x="520" y="192" width="400" height="162" class="groupbox"/>
  <text x="535" y="228" font-size="15" font-weight="700" fill="#111827" font-family="'Noto Sans CJK JP','Noto Sans',sans-serif">a[0..15] を水平加算(log2(16)=4段階)</text>
  <text x="535" y="250" font-size="15" font-weight="700" fill="#111827" font-family="'Noto Sans CJK JP','Noto Sans',sans-serif">→ S16(最終結果)</text>
  <text x="535" y="278" class="note">16要素が最初から1つのレジスタに収まるため、</text>
  <text x="535" y="296" class="note">左のようなレーンペアリング(2本の部分和を</text>
  <text x="535" y="314" class="note">重ねる加算)の段階は不要</text>

  <!-- comparison callout -->
  <rect x="40" y="378" width="880" height="58" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2" rx="8"/>
  <text x="60" y="400" class="note">S8 と S16 は数学的には同じ値の総和だが、グルーピング(足し合わせる順序)が違う。</text>
  <text x="60" y="420" class="note">浮動小数点の非結合性(F5参照)により、丸め方が変わり、ビットパターンが一致しない場合がある。</text>

  <!-- L3 badge -->
  <rect x="40" y="448" width="44" height="40" rx="8" fill="#ef6c00"/>
  <text x="62" y="474" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" font-family="'Noto Sans CJK JP','Noto Sans',sans-serif">L3</text>
  <text x="96" y="473" class="note">SIMDディスパッチ(どの命令セットを使うか)は実行時に環境が選ぶ(→ L3)</text>

  <!-- panel 2: documented evidence -->
  <rect x="40" y="506" width="880" height="176" class="panel2"/>
  <text x="60" y="532" font-size="15" font-weight="700" fill="#111827" font-family="'Noto Sans CJK JP','Noto Sans',sans-serif">文書で確認されている実例(NumPy issue #23523)</text>
  <text x="60" y="556" class="cellText">NumPyのAVX-512と非AVX-512のコードパスで `sin` / `cos` / `exp` / `log` が最大 約4 ULP 異なる。</text>
  <!-- fix round 1, Important 9: the quoted sentence is a translation of
       mattip's actual words ("We accept differences of up to 4 ULP from
       the golden results, depending on which implementations are
       used"), not of the research note's own "トレードオフ"
       characterisation of it — that word is dropped from inside the
       quotation marks. -->
  <text x="60" y="576" class="cellText">NumPyメンテナ mattip の発言: 「使用する実装によっては、golden resultsとの差を最大4 ULPまで許容している」(issue #23523)。</text>

  <rect x="60" y="592" width="840" height="76" class="caveatbox"/>
  <text x="78" y="614" font-size="13" font-weight="700" fill="#b91c1c" font-family="'Noto Sans CJK JP','Noto Sans',sans-serif">注意: これは超越関数(sin/cos/exp/log)での報告であり、`np.sum` 自体が</text>
  <text x="78" y="634" font-size="13" font-weight="700" fill="#b91c1c" font-family="'Noto Sans CJK JP','Noto Sans',sans-serif">AVX2とAVX-512で異なるという文書化された報告は無い(本プロジェクトの調査時点)。</text>
  <text x="78" y="654" font-size="13" fill="#7f1d1d" font-family="'Noto Sans CJK JP','Noto Sans',sans-serif">上の縮約木は非結合性という実在する機構の説明であり、`np.sum` の実測差を主張するものではない。</text>

  <!-- fix round 1, small fix: the NumPy 1.9.0 pairwise-summation release
       note is no longer cited here — this figure's claim is about
       SIMD-lane-width grouping generically, not about NumPy's specific
       documented pairwise/cascade summation algorithm, so that citation
       did not support a claim this figure actually makes. -->
  <text x="30" y="710" class="footnote">出典: NumPy issue #23523(AVX-512 vs 非AVX-512、sin/cos/exp/log)。調査ノート simd_blas_parallel.md 参照。</text>
</svg>
