<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800">
  <style>
    text { font-family: 'Noto Sans CJK JP', 'Noto Sans', sans-serif; }
    .title { font-size: 25px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 13px; fill: #4b5563; }
    .rowlabel { font-size: 14px; font-weight: 700; fill: #111827; }
    .rowsub { font-size: 12px; fill: #374151; }
    .runlabel { font-size: 11px; fill: #6b7280; }
    .caption { font-size: 13px; font-weight: 700; fill: #111827; }
    .badgetext { font-size: 12px; fill: #111827; }
    .footnote { font-size: 12px; fill: #6b7280; }
    .rowbox { fill: #fafafa; stroke: #d1d5db; stroke-width: 1.2; rx: 10; }
    .mechbox { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 10; }
  </style>

  <rect x="0" y="0" width="960" height="800" fill="#ffffff"/>

  <text x="30" y="38" class="title">F7. GPU上の非決定性 — atomic演算だけが毎回変わる</text>
  <text x="30" y="58" class="subtitle">実測: RTX 4090、PyTorch、同一プロセス内で5回実行(本プロジェクト自身の実測、2026-10-14)。</text>
  <line x1="30" y1="70" x2="930" y2="70" stroke="#e5e7eb" stroke-width="2"/>

  <!-- Row 1: MLP (cuBLAS GEMM) -->
  <rect x="20" y="86" width="920" height="130" class="rowbox"/>
  <text x="40" y="118" class="rowlabel">Linear+ReLUのMLPを</text>
  <text x="40" y="138" class="rowlabel">10ステップ学習</text>
  <text x="40" y="158" class="rowsub">(cuBLAS GEMM中心)</text>

  <g font-family="'Noto Sans CJK JP','Noto Sans',sans-serif">
    <circle cx="330" cy="135" r="26" fill="#ffffff" stroke="#1b5e20" stroke-width="2.5"/>
    <path d="M318,135 l9,9 l17,-19" fill="none" stroke="#1b5e20" stroke-width="3"/>
    <text x="330" y="172" text-anchor="middle" class="runlabel">run1</text>

    <circle cx="420" cy="135" r="26" fill="#ffffff" stroke="#1b5e20" stroke-width="2.5"/>
    <path d="M408,135 l9,9 l17,-19" fill="none" stroke="#1b5e20" stroke-width="3"/>
    <text x="420" y="172" text-anchor="middle" class="runlabel">run2</text>

    <circle cx="510" cy="135" r="26" fill="#ffffff" stroke="#1b5e20" stroke-width="2.5"/>
    <path d="M498,135 l9,9 l17,-19" fill="none" stroke="#1b5e20" stroke-width="3"/>
    <text x="510" y="172" text-anchor="middle" class="runlabel">run3</text>

    <circle cx="600" cy="135" r="26" fill="#ffffff" stroke="#1b5e20" stroke-width="2.5"/>
    <path d="M588,135 l9,9 l17,-19" fill="none" stroke="#1b5e20" stroke-width="3"/>
    <text x="600" y="172" text-anchor="middle" class="runlabel">run4</text>

    <circle cx="690" cy="135" r="26" fill="#ffffff" stroke="#1b5e20" stroke-width="2.5"/>
    <path d="M678,135 l9,9 l17,-19" fill="none" stroke="#1b5e20" stroke-width="3"/>
    <text x="690" y="172" text-anchor="middle" class="runlabel">run5</text>
  </g>
  <text x="510" y="202" text-anchor="middle" class="caption" fill="#1b5e20">5回ともbit-identical(実測)</text>

  <rect x="760" y="106" width="150" height="90" rx="8" fill="#ef6c00" fill-opacity="0.10" stroke="#ef6c00" stroke-width="1.3"/>
  <text x="775" y="128" font-size="13" font-weight="700" fill="#ef6c00">L3相当</text>
  <text x="775" y="148" class="badgetext">単一ストリーム・固定</text>
  <text x="775" y="164" class="badgetext">ワークスペースなら</text>
  <text x="775" y="180" class="badgetext">安定(cuBLAS文書)</text>

  <!-- Row 2: index_add_ default (atomics) -->
  <rect x="20" y="232" width="920" height="130" class="rowbox"/>
  <text x="40" y="264" class="rowlabel">重複indexへの</text>
  <text x="40" y="284" class="rowlabel">`index_add_`</text>
  <text x="40" y="304" class="rowsub">(既定設定、atomicAdd経路)</text>

  <g font-family="'Noto Sans CJK JP','Noto Sans',sans-serif">
    <circle cx="330" cy="281" r="26" fill="#ffffff" stroke="#c62828" stroke-width="2.5"/>
    <line x1="318" y1="269" x2="342" y2="293" stroke="#c62828" stroke-width="3"/>
    <line x1="342" y1="269" x2="318" y2="293" stroke="#c62828" stroke-width="3"/>
    <text x="330" y="318" text-anchor="middle" class="runlabel">run1</text>

    <circle cx="420" cy="281" r="26" fill="#ffffff" stroke="#c62828" stroke-width="2.5"/>
    <line x1="408" y1="269" x2="432" y2="293" stroke="#c62828" stroke-width="3"/>
    <line x1="432" y1="269" x2="408" y2="293" stroke="#c62828" stroke-width="3"/>
    <text x="420" y="318" text-anchor="middle" class="runlabel">run2</text>

    <circle cx="510" cy="281" r="26" fill="#ffffff" stroke="#c62828" stroke-width="2.5"/>
    <line x1="498" y1="269" x2="522" y2="293" stroke="#c62828" stroke-width="3"/>
    <line x1="522" y1="269" x2="498" y2="293" stroke="#c62828" stroke-width="3"/>
    <text x="510" y="318" text-anchor="middle" class="runlabel">run3</text>

    <circle cx="600" cy="281" r="26" fill="#ffffff" stroke="#c62828" stroke-width="2.5"/>
    <line x1="588" y1="269" x2="612" y2="293" stroke="#c62828" stroke-width="3"/>
    <line x1="612" y1="269" x2="588" y2="293" stroke="#c62828" stroke-width="3"/>
    <text x="600" y="318" text-anchor="middle" class="runlabel">run4</text>

    <circle cx="690" cy="281" r="26" fill="#ffffff" stroke="#c62828" stroke-width="2.5"/>
    <line x1="678" y1="269" x2="702" y2="293" stroke="#c62828" stroke-width="3"/>
    <line x1="702" y1="269" x2="678" y2="293" stroke="#c62828" stroke-width="3"/>
    <text x="690" y="318" text-anchor="middle" class="runlabel">run5</text>
  </g>
  <text x="510" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">5回とも不一致 / 最大差 |Δ|=8.24×10⁻⁴(実測)</text>

  <rect x="760" y="252" width="150" height="90" rx="8" fill="#c62828" fill-opacity="0.10" stroke="#c62828" stroke-width="1.3"/>
  <text x="775" y="274" font-size="13" font-weight="700" fill="#c62828">L4</text>
  <text x="775" y="294" class="badgetext">保証なし</text>
  <text x="775" y="314" class="badgetext">(atomicAddの</text>
  <text x="775" y="330" class="badgetext">加算順序に依存)</text>

  <!-- Row 3: index_add_ deterministic -->
  <rect x="20" y="378" width="920" height="130" class="rowbox"/>
  <text x="40" y="408" class="rowlabel">同じ `index_add_` を</text>
  <text x="40" y="428" class="rowlabel">`use_deterministic_</text>
  <text x="40" y="448" class="rowlabel">algorithms(True)` 下で実行</text>

  <g font-family="'Noto Sans CJK JP','Noto Sans',sans-serif">
    <circle cx="330" cy="427" r="26" fill="#ffffff" stroke="#1b5e20" stroke-width="2.5"/>
    <path d="M318,427 l9,9 l17,-19" fill="none" stroke="#1b5e20" stroke-width="3"/>
    <text x="330" y="464" text-anchor="middle" class="runlabel">run1</text>

    <circle cx="420" cy="427" r="26" fill="#ffffff" stroke="#1b5e20" stroke-width="2.5"/>
    <path d="M408,427 l9,9 l17,-19" fill="none" stroke="#1b5e20" stroke-width="3"/>
    <text x="420" y="464" text-anchor="middle" class="runlabel">run2</text>

    <circle cx="510" cy="427" r="26" fill="#ffffff" stroke="#1b5e20" stroke-width="2.5"/>
    <path d="M498,427 l9,9 l17,-19" fill="none" stroke="#1b5e20" stroke-width="3"/>
    <text x="510" y="464" text-anchor="middle" class="runlabel">run3</text>

    <circle cx="600" cy="427" r="26" fill="#ffffff" stroke="#1b5e20" stroke-width="2.5"/>
    <path d="M588,427 l9,9 l17,-19" fill="none" stroke="#1b5e20" stroke-width="3"/>
    <text x="600" y="464" text-anchor="middle" class="runlabel">run4</text>

    <circle cx="690" cy="427" r="26" fill="#ffffff" stroke="#1b5e20" stroke-width="2.5"/>
    <path d="M678,427 l9,9 l17,-19" fill="none" stroke="#1b5e20" stroke-width="3"/>
    <text x="690" y="464" text-anchor="middle" class="runlabel">run5</text>
  </g>
  <text x="510" y="486" text-anchor="middle" class="caption" fill="#1b5e20">5回ともbit-identical(実測)</text>

  <rect x="760" y="398" width="150" height="90" rx="8" fill="#6b7280" fill-opacity="0.10" stroke="#6b7280" stroke-width="1.3"/>
  <text x="775" y="420" font-size="13" font-weight="700" fill="#374151">対策後: 安定</text>
  <text x="775" y="440" class="badgetext">新しい保証レベルを</text>
  <text x="775" y="456" class="badgetext">作るものではない</text>
  <text x="775" y="472" class="badgetext">(工学的な回避策)</text>

  <!-- mechanism callout -->
  <rect x="20" y="528" width="920" height="188" class="mechbox"/>
  <text x="40" y="554" font-size="15" font-weight="700" fill="#111827">なぜ Row2 だけ変わるのか(出典: PyTorch `torch.use_deterministic_algorithms` ドキュメント)</text>
  <text x="40" y="580" font-size="13" fill="#111827">`index_add_` などのCUDA実装は `atomicAdd` を使う。`atomicAdd` は読み書きの不可分性(他スレッドに割り込まれ</text>
  <text x="40" y="600" font-size="13" fill="#111827">ないこと)は保証するが、どのスレッドが何番目に足すかという順序は保証しない。</text>
  <text x="40" y="624" font-size="13" fill="#111827">GPUのスレッドスケジューリングは毎回変わりうるため加算の順序が変わり、浮動小数点の非結合性</text>
  <text x="40" y="644" font-size="13" fill="#111827">(F5参照)と合わさって最終値も変わりうる。</text>
  <text x="40" y="676" font-size="13" fill="#111827">一方 Row1 の cuBLAS GEMM は、単一ストリーム・固定ワークスペースの下ではrun-to-runで決定的</text>
  <text x="40" y="696" font-size="13" fill="#111827">(NVIDIA cuBLAS文書)であり、atomicAddを使わない — だからRow1は既定のままでも安定する。</text>

  <text x="30" y="746" class="footnote">出典: 本プロジェクトの実測(anakin, RTX 4090, 2026-10-14)。PyTorch `torch.use_deterministic_algorithms` ドキュメント、NVIDIA cuBLAS "Results Reproducibility" 節。</text>
  <text x="30" y="764" class="footnote">詳細は調査ノート gpu_cuda_pytorch.md、プローブ実装 reprobench/probes/s8_torch_gpu.py 参照。</text>
</svg>
